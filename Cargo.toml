[package]
name = "riot_local_auth"
version = "0.1.0"
authors = ["FX"]
license = "MIT"
edition = "2021"

[dependencies]
thiserror = "2.0.18"
base64 = "0.22.1"
ureq = { version = "3.3.0", default-features = false, features = [
    "gzip",
    "rustls-no-provider",
    "json",
] }
rustls = { version = "0.23", default-features = false, features = [
    "aws-lc-rs",
    "std",
    "tls12",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
